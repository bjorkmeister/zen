<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Tyyni · {{ date_short }}</title>
</head>
<body style="margin:0; padding:0; background:#F6F4EF; -webkit-text-size-adjust:100%;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">{{ atmosphere }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F4EF;">
  <tr>
    <td align="center" style="padding:48px 20px 56px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

        <tr>
          <td align="center" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:11px; line-height:1.6; letter-spacing:2px; text-transform:uppercase; color:#76726A;">
            {{ date_long }} &nbsp;·&nbsp; N:o {{ number }}
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:14px 0 30px; font-family:Georgia,'Times New Roman',serif; font-size:46px; line-height:1; color:#181818;">
            Tyyni
          </td>
        </tr>
        <tr><td style="border-top:1px solid #E2DFD7; font-size:0; line-height:0;">&nbsp;</td></tr>

        <tr>
          <td align="center" style="padding:34px 12px 10px; font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:21px; line-height:1.45; color:#181818;">
            {{ atmosphere }}
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 0 34px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.6; color:#76726A;">
            Nyt {{ temp_now }} &nbsp;·&nbsp; Aurinko {{ sun }} &nbsp;·&nbsp; Valoa {{ daylight }}
          </td>
        </tr>
        <tr><td style="border-top:1px solid #E2DFD7; font-size:0; line-height:0;">&nbsp;</td></tr>

        <tr>
          <td style="padding:30px 0 8px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:11px; line-height:1.6; letter-spacing:2px; text-transform:uppercase; color:#76726A;">
            {{ synthesis_label }}
          </td>
        </tr>
        <tr>
          <td style="padding:0 0 30px; font-family:Georgia,'Times New Roman',serif; font-size:18px; line-height:1.55; color:#181818;">
            {{ synthesis }}
          </td>
        </tr>
        <tr><td style="border-top:1px solid #E2DFD7; font-size:0; line-height:0;">&nbsp;</td></tr>

        <tr>
          <td style="padding:30px 0 6px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:11px; line-height:1.6; letter-spacing:2px; text-transform:uppercase; color:#76726A;">
            Tänään lehdessä
          </td>
        </tr>
        <!-- signal -->
        <tr>
          <td style="padding:10px 0; font-family:Georgia,'Times New Roman',serif; font-size:18px; line-height:1.35; color:#181818;">
            <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#76726A;">{{ signal_label }}</span><br>
            {{ signal_title }}
          </td>
        </tr>
        <!-- /signal -->

        <tr>
          <td align="center" style="padding:38px 0 42px;">
            <a href="{{ url }}" style="display:inline-block; padding:14px 28px; border:1px solid #181818; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#181818; text-decoration:none;">Avaa päivän Tyyni</a>
          </td>
        </tr>
        <tr><td style="border-top:1px solid #E2DFD7; font-size:0; line-height:0;">&nbsp;</td></tr>

        <tr>
          <td align="center" style="padding:40px 16px 0; font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:20px; line-height:1.45; color:#181818;">
            {{ zen_anchor }}
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
