name: Morning edition

# Three editions a day, at 6.00, 14.00 and 20.00 in Helsinki (EDITIONS in
# generate.py). GitHub's scheduler can delay or drop runs, so instead of
# firing at exact times the workflow looks in every half hour and publishes
# only when the latest edition is missing from the page. The look-in at :50
# publishes the coming edition ten minutes early; if that one is lost, the next
# look-in publishes it. A look-in that finds nothing due takes a few seconds.
on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:   # publishes immediately, whatever the time

permissions:
  contents: read

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v5

      - id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python3 generate.py --due
          fi

  edition:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # commit index.html back to the repository
      pages: write      # publish to GitHub Pages
      id-token: write   # required by deploy-pages
      issues: write     # morning notification
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-genai==3.3.0 feedparser==6.0.14

      - name: Write the edition
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u generate.py

      - name: Commit index.html
        env:
          NUMBER: ${{ steps.generate.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit --quiet -m "Aamun arkki N:o $NUMBER · $(TZ=Europe/Helsinki date '+%F %H.%M')"
            git pull --rebase --quiet   # in case main moved while the edition was being written
            git push --quiet
          fi

      - name: Stage the page
        run: mkdir -p _site && cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Send the morning link
        if: steps.generate.outputs.morning == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DATE: ${{ steps.generate.outputs.date }}
          NUMBER: ${{ steps.generate.outputs.number }}
          ATMOSPHERE: ${{ steps.generate.outputs.atmosphere }}
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          body=$(printf '**%s · N:o %s**\n\n%s\n\n%s' "$DATE" "$NUMBER" "$ATMOSPHERE" "$URL")
          thread=$(gh issue list --state open --search 'author:app/github-actions in:title "Aamun arkki"' \
                     --json number --jq '.[0].number // empty')
          if [ -n "$thread" ]; then
            gh issue comment "$thread" --body "$body"
          else
            gh issue create --title "Aamun arkki" \
              --body "$(printf '@%s – tähän ketjuun tulee joka aamu linkki päivän arkkiin.\n\n%s' "$OWNER" "$body")"
          fi
