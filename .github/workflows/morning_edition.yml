name: Morning edition

# Three editions a day, at 6.00, 14.00 and 20.00 in Helsinki. Each run starts
# ten minutes early because GitHub's scheduler is busiest on the hour, and a
# backup run follows half an hour later because GitHub sometimes drops
# scheduled runs. A backup that finds its edition already published stops
# before doing anything; one that finds it missing publishes it.
# GitHub cron runs in UTC and Finland shifts between UTC+2 and UTC+3, so both
# sets of times are scheduled and the clock job lets through only the set that
# matches Helsinki's current offset. The edition hours also live in generate.py.
on:
  schedule:
    - cron: "50 2,10,16 * * *"   # 5.50, 13.50, 19.50 Finnish summer time (UTC+3)
    - cron: "20 3,11,17 * * *"   # 6.20, 14.20, 20.20 summer time backup
    - cron: "50 3,11,17 * * *"   # 5.50, 13.50, 19.50 Finnish winter time (UTC+2)
    - cron: "20 4,12,18 * * *"   # 6.20, 14.20, 20.20 winter time backup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          go=true
          if [ "$EVENT" = "schedule" ]; then
            offset=$(TZ=Europe/Helsinki date +%z)
            case "$SCHEDULE" in
              "50 2,10,16 * * *"|"20 3,11,17 * * *") [ "$offset" = "+0300" ] || go=false ;;
              "50 3,11,17 * * *"|"20 4,12,18 * * *") [ "$offset" = "+0200" ] || go=false ;;
            esac
          fi
          echo "Helsinki offset $(TZ=Europe/Helsinki date +%z), go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  edition:
    needs: clock
    if: needs.clock.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # commit index.html back to the repository
      pages: write      # publish to GitHub Pages
      id-token: write   # required by deploy-pages
      issues: write     # morning notification
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-genai==3.3.0 feedparser==6.0.14

      - name: Write today's edition
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u generate.py

      - name: Commit index.html
        if: steps.generate.outputs.published == 'true'
        env:
          NUMBER: ${{ steps.generate.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit --quiet -m "Aamun arkki N:o $NUMBER · $(TZ=Europe/Helsinki date '+%F %H.%M')"
            git pull --rebase --quiet   # in case main moved while the edition was being written
            git push --quiet
          fi

      - name: Stage the page
        if: steps.generate.outputs.published == 'true'
        run: mkdir -p _site && cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v4
        if: steps.generate.outputs.published == 'true'
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.generate.outputs.published == 'true'

      - name: Send the morning link
        if: steps.generate.outputs.published == 'true' && steps.generate.outputs.morning == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          DATE: ${{ steps.generate.outputs.date }}
          NUMBER: ${{ steps.generate.outputs.number }}
          ATMOSPHERE: ${{ steps.generate.outputs.atmosphere }}
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          body=$(printf '**%s · N:o %s**\n\n%s\n\n%s' "$DATE" "$NUMBER" "$ATMOSPHERE" "$URL")
          thread=$(gh issue list --state open --search 'author:app/github-actions in:title "Aamun arkki"' \
                     --json number --jq '.[0].number // empty')
          if [ -n "$thread" ]; then
            gh issue comment "$thread" --body "$body"
          else
            gh issue create --title "Aamun arkki" \
              --body "$(printf '@%s – tähän ketjuun tulee joka aamu linkki päivän arkkiin.\n\n%s' "$OWNER" "$body")"
          fi
